<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg" href="assets/coffee-cup.svg">
    <title>Coffee House</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="header">
        <div class="header-container">
            <a class="header-logo" href="index.html">
                <img class="logo-light" src="assets/logo.svg" alt="Coffee House">
                <img class="logo-dark" src="assets/logo-1.svg" alt="Coffee House"></a>
            <nav class="header-nav">
                <ul>
                    <li>
                        <a href="index.html#favorite">Favorite coffee</a>
                    </li>
                    <li>
                        <a href="index.html#about">About</a>
                    </li>
                    <li>
                        <a href="index.html#mobile">Mobile app</a>
                    </li>
                    <li>
                        <a href="#contacts">Contact us</a>
                    </li>
                </ul>
            </nav>
            <div class="header-actions">
                <button class="theme-button" id="theme-toggle" type="button">
                    <img src="assets/Light.svg" alt="светлая тема">
                    <img src="assets/Dark.svg" alt="темная тема">
                </button>
                <button class="mobile-menu-button" id="mobile-menu-button" type="button" aria-label="Открыть меню">
                    <span></span>
                    <span></span>
                </button>
                <a class="header-menu" href="menu.html">Menu
                    <img src="assets/coffee-cup.svg" alt="Menu">
                </a>
            </div>
        </div>
        <div class="mobile-menu" id="mobile-menu">
            <a href="index.html#favorite">Favorite coffee</a>
            <a href="index.html#about">About</a>
            <a href="index.html#mobile">Mobile app</a>
            <a href="#contacts">Contact us</a>
            <a href="menu.html">Menu
                <img src="assets/coffee-cup.svg" alt="Menu">
            </a>
        </div>
    </header>
    <main>
        <section class="menu-page">
            <h1>Behind each of our cups hides an <span>amazing surprise</span></h1>
            <div class="menu-categories">
                <button class="menu-category active" type="button" data-category="coffee">
                    <span class="menu-category-dot"></span>
                    Coffee
                </button>

                <button class="menu-category" type="button" data-category="tea">
                    <span class="menu-category-dot"></span>
                    Tea
                </button>

                <button class="menu-category" type="button" data-category="dessert">
                    <span class="menu-category-dot"></span>
                    Dessert
                </button>
            </div>
            <div class="menu-grid"></div>
            <div class="load-more-wrapper">
                <button class="load-more" type="button" aria-label="Load more">
                    <span>↓</span>
                </button>
            </div>
        </section>
    </main>
    <footer class="footer" id="contacts">
        <div class="footer-left">
            <h2>Sip, Savor, Smile.</h2>
            <p>It's coffee time!</p>
            <div class="footer-socials">
                <a href="https://twitter.com/" aria-label="Twitter">
                    <img src="assets/twitter.svg" alt="twitter">
                </a>
                <a href="https://instagram.com/" aria-label="Instagram">
                    <img src="assets/instagram.svg" alt="instagram">
                </a>
                <a href="https://facebook.com/" aria-label="Facebook">
                    <img src="assets/facebook.svg" alt="facebook">
                </a>
            </div>
        </div>
        <div class="footer-right">
            <h3>Contact us</h3>
            <a href="https://www.google.com/maps/search/8558+Green+Rd+LA/@48.5033317,-122.3348632,17z/data=!3m1!4b1?entry=ttu&g_ep=EgoyMDI2MDkxNS4wIKXMDSoASAFQAw%3D%3D"
                class="footer-contact">
                <img src="assets/pin-alt.svg" alt="">
                8558 Green Rd., LA
            </a>
            <a href="#" class="footer-contact">
                <img src="assets/phone.svg" alt="">
                +1(603)555-0123
            </a>
            <p class="footer-contact">
                <img src="assets/clock.svg" alt="">
                Mon-Sat: 9:00-23:00
            </p>
        </div>
    </footer>
    <script src="script.js"></script>
</body>

</html>
